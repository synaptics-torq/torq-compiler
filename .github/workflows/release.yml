name: Release

on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  pages: write
  actions: read  
  packages: write
  attestations: write
  
concurrency:
  # we release only the last push to each ref_name but we let each release process to complete
  group: release-${{ github.ref_name }}

jobs:
  
  build:
    name: Build release
    uses: ./.github/workflows/build-torq.yml
    with:
      push: true
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  test:
    name: Test release
    needs: build
    if: ${{ vars.DISABLE_TESTS != 'true' }}
    uses: ./.github/workflows/test-build.yml
    with:      
      push_images: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  release_assets:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    
    outputs:
      tag_name: ${{ steps.upload_assets.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download user documentation
        uses: actions/download-artifact@v8
        with:
          name: user-manual
          path: dist/user_manual

      - name: Download full documentation
        uses: actions/download-artifact@v8
        with:
          name: website
          path: dist/website

      - name: Download host runtime wheel
        uses: actions/download-artifact@v8
        with:
          name: host-runtime-wheel
          path: dist

      - name: Download Astra SL runtime wheel
        uses: actions/download-artifact@v8
        with:
          name: astra-sl-runtime-wheel
          path: dist

      - name: Download host turbine wheel
        uses: actions/download-artifact@v8
        with:
          name: host-turbine-wheel
          path: dist

      - name: Download compiler wheel
        uses: actions/download-artifact@v8
        with:
          name: host-compiler-wheel
          path: dist

      - name: Docker meta (generate tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/compiler          
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Prepare release docker build context
        run: |
          mkdir -p docker/dist
          cp dist/*x86_64.whl docker/dist/
          cp scripts/apt-packages.txt docker/
          cp requirements.txt docker/
          cp scripts/Dockerfile.release docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
      
      - name: Build and push release docker
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/compiler:latest
          cache-to: type=inline

      - name: Compress the user manual as a zip
        run: |
          cd dist
          zip -r user_manual.zip user_manual
          rm -rf user_manual

      - name: Compress the full documentation as a zip
        run: |
          cd dist/website
          zip -r ../documentation.zip .   # this is the name and format expected by site building action
          cd ..
          rm -rf website

      - name: Upload assets to release        
        id: upload_assets
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}          
        run: |

          CREATION_FLAGS=""
  
          # determine the release tag name, title and note based on the ref that triggered the workflow
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then  
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TAG_NAME="snapshot"              
            else
              TAG_NAME="snapshot-${{ github.ref_name }}"              
            fi
            TITLE="Development Snapshot (${{ github.ref_name }})"
            CREATION_FLAGS="--prerelease"
            NOTE="Latest build from ${{ github.ref_name }}. Unstable. Replaced on each commit."
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Torq version ${{ github.ref_name }}"
            NOTE="Release for tag ${{ github.ref_name }}."
            CREATION_FLAGS="--draft"
          else
            echo "Not a branch or tag ref: ${{ github.ref }}"
            exit 1
          fi

          # ensure the release exists, creating it if necessary
          if gh release -R "$TARGET_REPOSITORY" view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release on tag '$TAG_NAME' already exists"
          else
            gh release -R "$TARGET_REPOSITORY" create "$TAG_NAME" \
              -t "$TITLE" \
              -n "$NOTE" \
              $CREATION_FLAGS
          fi

          # remove old wheel assets since we will change their name
          gh release view "$TAG_NAME" --json assets --jq '.assets[] | select(.name | endswith(".whl")) | .name' |
          while IFS= read -r asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset "$TAG_NAME" "$asset" --yes
          done

          # upload the new assets, clobbering any existing ones with the same name
          gh release upload "$TAG_NAME" dist/* --clobber

          echo "Release published successfully for tag '$TAG_NAME'"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
  
  update_site:
    name: Update website
    runs-on: ubuntu-latest
    needs: release_assets

    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}v/${{ needs.release_assets.outputs.tag_name }}
 
    concurrency:
        group: publish-site

    # permissions so that we can fetch workflow artifacts and publish the website
    permissions:
        pages: write
        actions: read
        id-token: write
        contents: read

    steps:

        - name: Create site with all versions of the documentation
          uses: syna-astra-dev/action-doc-publish/actions/doc-create-site@v4
          id: create_site
          with:
            repository: ${{ github.repository }}
            token: ${{ github.token }}
            disable_branch_docs: true

        - name: Upload GitHub Pages artifact
          uses: actions/upload-pages-artifact@v5
          with:
            path: _build/site/html
            retention-days: 1   # we can discard the artifacts after the site is published
            include-hidden-files: true

        # WARNING: due to a bug in github (see https://github.com/actions/deploy-pages/issues/383)
        # the deploy-pages action will not update the site when the current main is tagged
        - name: Deploy website
          id: deployment
          uses: actions/deploy-pages@v5
