name: Maintainer approval

on:
  pull_request_target:
    types: [labeled]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  approve:
    if: github.event.label.name == 'maintainer-approved'
    runs-on: ubuntu-latest
    environment: approvals

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_PRIVATE_KEY }}

      - name: Check labeler has maintain rights
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          USER: ${{ github.event.sender.login }}
        run: |
          PERMISSION=$(gh api /repos/$REPO/collaborators/$USER/permission --jq '.permission')
          echo "User permission: $PERMISSION"
          echo "$PERMISSION" | grep -qE '^(maintain|admin)$' || exit 1

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" \
            --approve \
            --body "Approved by @$GITHUB_ACTOR via maintainer-approved label."