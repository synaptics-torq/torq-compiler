name: Astra Machina SL

on:
  workflow_call:
    inputs:
      docker_image_tests_name:
        type: string
        required: true
    secrets:
      CI_APP_PRIVATE_KEY:
        required: true
      HF_TOKEN:
        required: true
      JENKINS_API_TOKEN:
        required: true

permissions:
    id-token: write
    contents: read

env:
  GENERATE_STATUS_REPORT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name || '', 'generate-test-status-report') && 'true' || 'false' }}
  DASHBOARD_SERVER: ${{ contains(github.event.pull_request.labels.*.name || '', 'test-stage-dashboard') && vars.DASHBOARD_URL_TORQ_COMPILER_DEV_DASHBOARD_STAGE || vars.DASHBOARD_URL_TORQ_COMPILER_DEV_DASHBOARD_PROD }}

jobs:
  test_astra_machina_sl:    
    name: Test on Astra Machina SL for ${{ matrix.chip }}

    strategy:
      fail-fast: false
      matrix:
        # one job per chip; the BOARD_TEST_CHIPS repository variable lists them, e.g.
        # ["sl2610-v1"]. The runner, runtime and bench below are those of the Astra Machina SL
        # boards: a chip with other boards (e.g. SR200) needs its own runner and runtime.
        chip: ${{ vars.BOARD_TEST_CHIPS && fromJSON(vars.BOARD_TEST_CHIPS) || fromJSON('["sl2610-v1"]') }}

    runs-on: astra-machina-sl

    timeout-minutes: 50 # this is not enough in case there is a lot of contention on astra machina but we can't increase it as codebuild kills the job at 60 mins anyways
    
    concurrency:
      group: astra_machina_sl_${{ matrix.chip }} # only one job at a time can take control of the boards
      queue: max

    container:
      image: ${{ inputs.docker_image_tests_name }}
      options: ${{ vars.ASTRA_MACHINA_SL_DOCKER_OPTIONS }}

    # relative to the workspace: in the job container github.workspace is the host path, not the
    # container one (/__w/...), so pytest would write outside the workspace and nothing is uploaded
    env:
      RUNTIME_PROFILING_OUTPUT_DIR: astra_machina_sl_profiling_logs_${{ matrix.chip }}
      TEST_STATUS_REPORT_PATH: astra_machina_sl_test_status_${{ matrix.chip }}.json

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Configure AWS credentials
        uses: ./.github/actions/configure-aws-credentials
        id: configure-aws-credentials
        with:
          aws_region: ${{ vars.AWS_REGION }}
          protected_role_arn: ${{ vars.MAIN_BRANCH_ROLE_ARN }}
          non_protected_role_arn: ${{ vars.PULL_REQUEST_ROLE_ARN }}

      - name: Run Astra Machina SL tests
        uses: ./.github/actions/tests
        with:
          app_id: ${{ vars.CI_APP_ID }}
          app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          extra_repo: ${{ vars.EXTRAS_REPO }}
          hf_token: ${{ secrets.HF_TOKEN }}
          use_bench: true
          jenkins_user: ${{ vars.JENKINS_USER }}
          jenkins_api_token: ${{ secrets.JENKINS_API_TOKEN }}
          jenkins_url: ${{ vars.JENKINS_URL }}
          jenkins_job: ${{ vars.JENKINS_JOB }}
          pytest_args: >-
            -m astra_machina_sl_ci -n 4
            --torq-runtime-hw-type astra_machina
            --torq-runtime-timeout=20
            --torq-runtime-runs=10
            --torq-chips ${{ matrix.chip }}
            --torq-runtime-profiling-output-dir=${{ env.RUNTIME_PROFILING_OUTPUT_DIR }}
            --torq-step-timings=${{ env.RUNTIME_PROFILING_OUTPUT_DIR }}/step_timings.json
            --tflite-layer-test-generate-full-model-only
            ${{ env.GENERATE_STATUS_REPORT == 'true' && format('--try-xfails --save-test-status-report-to {0}', env.TEST_STATUS_REPORT_PATH) || '' }}
          ignore_failures: ${{ env.GENERATE_STATUS_REPORT }}
          torq_perf_server: ${{ env.DASHBOARD_SERVER }}
          batch_name: astra-machina-sl-${{ matrix.chip }}
          s3_hf_cache_bucket: ${{ vars.SCCACHE_BUCKET }}
          s3_hf_cache_dir: hf_cache

      - name: Summarize the board runs
        if: always()
        shell: bash
        run: |
          python3 scripts/summarize_board_runs.py ${{ env.RUNTIME_PROFILING_OUTPUT_DIR }} \
            --step-timings ${{ env.RUNTIME_PROFILING_OUTPUT_DIR }}/step_timings.json >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Astra Machina SL profiling logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astra_machina_sl_profiling_logs_${{ matrix.chip }}
          path: ${{ env.RUNTIME_PROFILING_OUTPUT_DIR }}
          retention-days: 60

      - name: Upload Astra Machina SL test status report
        if: env.GENERATE_STATUS_REPORT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: astra_machina_sl_test_status_${{ matrix.chip }}
          path: ${{ env.TEST_STATUS_REPORT_PATH }}
          retention-days: 60
