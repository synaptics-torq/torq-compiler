on:
  workflow_call:
    inputs:
      release_artifact_id:
        description: ID of the artifact with the release package to download
        required: true
        type: string
      push:
        description: Push the built docker image to the registry
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:

  build_release_docker_image:

    name: Build release docker image
    runs-on: ubuntu-latest

    steps:
      - name: Download the compiler and runtime
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: release

      - name: Extract the compiler and runtime
        working-directory: release
        run: |
          tar -zxf release.tar.gz --strip-components=1

      - name: Docker meta (generate tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/compiler          
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
      
      - name: Build and push release docker
        uses: docker/build-push-action@v7
        with:
          context: release
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/compiler:latest
          cache-to: type=inline
