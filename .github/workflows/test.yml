name: Test

on: 
  
  # opened, synchronized, reopened are the standard events that trigger a PR build
  # we want to re-run also when the PR is re-labeled and ready for review because more test may be needed
  pull_request:    
    types: [opened, synchronize, reopened, labeled, ready_for_review]

  # when the commit enters the merge queue we re-test it to see if it is still valid
  merge_group:

concurrency:  
  # we to run at most once this workflow for the same type of events
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write # used to assume AWS roles
  contents: read  
  packages: write
  attestations: write
  
jobs:

  check_format:
    name: Check code formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run format check
        run: |
          scripts/format-code
          git diff --exit-code

  build:
    name: Build
    needs: check_format
    if: ${{ vars.CODEBUILD_PROJECT_CODEBASE != '' && github.event_name != 'workflow_call' }}
    uses: ./.github/workflows/build-torq.yml    
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LINUX_KERNEL_SSH_KEY: ${{ secrets.LINUX_KERNEL_SSH_KEY }}

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test-build.yml
    with:
      test_cmodel: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'skip-test-cmodel')) }}
      test_astra_machina_sl: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'test-astra-machina-sl')) }}
      test_aws_fpga: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'test-aws')) }}
      # torq.lab is hardware-free, so run it per PR like cmodel: on by default,
      # opt out on draft PRs with the 'skip-test-torq-lab' label.
      test_torq_lab: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'skip-test-torq-lab')) }}
    secrets:
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
