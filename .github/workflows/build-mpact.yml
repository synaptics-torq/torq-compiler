name: Build mpact

on:
  workflow_call:
    outputs:
      cache_key:
        description: Cache key of the built artifact
        value: ${{ jobs.check_cache.outputs.cache-key }}

      path:
        description: Path to the built artifact
        value: ${{ jobs.check_cache.outputs.path }}

    inputs:
      target:
        type: string
        description: Target platform for the build
        required: true
        default: ubuntu-24.04

jobs:

  check_cache:
    name: Check mpact ${{ inputs.target }}
    runs-on: ubuntu-24.04

    outputs:
      cache-key: ${{ steps.gen_vars.outputs.cache_key }}
      cache-hit: ${{ steps.lookup_cache.outputs.cache-hit }}
      path: ${{ steps.gen_vars.outputs.path }}

    steps:      
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Generate cache key and paths
        id: gen_vars
        run: |

          MPACT_REF=$(git rev-parse HEAD:third_party/coralnpu/mpact)

          echo "cache_key=mpact-${{ inputs.target }}-${MPACT_REF}-${{ hashFiles('.github/workflows/build-mpact.yml') }}" >> $GITHUB_OUTPUT
          echo "path=coralnpu-mpact-simulator-${{ inputs.target }}-${MPACT_REF}.tar.gz" >> $GITHUB_OUTPUT

      - id: lookup_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.gen_vars.outputs.path }}
          key: ${{ steps.gen_vars.outputs.cache_key }}
          lookup-only: true
          enableCrossOsArchive: true

  build:
    name: Build mpact ${{ inputs.target }}
    runs-on: ${{ inputs.target }}
    needs: check_cache

    if: needs.check_cache.outputs.cache-hit != 'true'

    steps:

      - name: Checkout actions
        uses: actions/checkout@v6

      - name: Checkout coralnpu-mpact
        run: |
          git submodule update --init --depth=1 third_party/coralnpu/mpact          

      - name: Build mpact simulation library
        run: |
          cd third_party/coralnpu/mpact
          bazel build sim/hw_sim:libcoralnpu_simulator_mpact.so

      - name: Package the mpact simulation library
        run: |
          mkdir -p mpact-lib
          cp third_party/coralnpu/mpact/bazel-bin/sim/hw_sim/libcoralnpu_simulator_mpact.so mpact-lib/
          cp third_party/coralnpu/mpact/sim/hw_sim/coralnpu_simulator.h mpact-lib/
          tar -czvf ${{ needs.check_cache.outputs.path }} -C mpact-lib .

      - name: Upload to cache
        uses: actions/cache/save@v5
        with:
          path: ${{ needs.check_cache.outputs.path }}
          key: ${{ needs.check_cache.outputs.cache-key }}
          enableCrossOsArchive: true
