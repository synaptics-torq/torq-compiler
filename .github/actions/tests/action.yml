description: Run Torq compiler tests

inputs:

  release_run_id:
    description: 'Run ID of the artifact with the built release'
    default: ${{ github.run_id }}
    required: true

  hf_token:
    description: 'HuggingFace Token'
    required: true

  pytest_args:
    description: 'Arguments to pass to pytest'
    required: true

  app_id:
    description: 'GitHub App ID'
    required: false
  
  app_private_key:
    description: 'GitHub App Private Key'
    required: false

  extra_repo:
    description: 'Extras repository to checkout'
    required: false

  test_data_cache_artifact:
    description: 'Name of the test data cache artifact to generate'
    required: false

  precomputed_cache:
    description: 'S3 path to precomputed test data cache artifact to download'
    required: false

  s3_artifact_bucket:
    description: 'S3 bucket to upload the test cache artifact'
    required: false
    default: ''

  torq_perf_server:
    description: 'Torq Performance Server URL'
    required: false
    default: ''
    
  torq_perf_server_token:
    description: 'Torq Performance Server Token'
    required: false
    default: ''

  batch_name:
    description: 'Name of the test run batch for Torq reporting.'
    required: false
    default: 'default'

  s3_hf_cache_bucket:
    description: 'S3 bucket for HuggingFace data cache'
    required: false
    default: ''

  s3_hf_cache_dir:
    description: 'Directory in S3 bucket for HuggingFace data cache'
    required: false
    default: ''

  setup_external_engine_requirements:
    description: 'Requirements for external engines.'
    required: false
    default: "false"

  use_bench:
    description: 'Whether to setup bench for testing'
    required: false
    default: "false"

  jenkins_user:
    description: 'Jenkins user for boards management'
    required: false

  jenkins_api_token:
    description: 'Jenkins API token for boards management'
    required: false
  
  jenkins_url:
    description: 'Jenkins URL for boards management'
    required: false
  
  jenkins_job:
    description: 'Jenkins job name for boards management'
    required: false

  ignore_failures:
    description: 'Whether to ignore test failures and continue the workflow'
    required: false
    default: "false"

outputs:
  s3_cache_path:
    description: 'S3 path of the uploaded test data cache artifact'
    value: ${{ steps.upload_s3.outputs.s3_cache_path }}

runs:
  using: "composite"
  steps:

    - name: Generate GitHub token
      id: generate_token
      uses: actions/create-github-app-token@v3
      if: ${{ inputs.app_id != '' }}
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}

    - name: Read extra repository SHA
      id: read_extra_repo_sha
      if: ${{ inputs.extra_repo != '' }}
      shell: bash
      run: |
        EXTRA_REPO_SHA=$(cat scripts/extras.gitlink)
        echo "extra_repo_sha=$EXTRA_REPO_SHA" >> $GITHUB_OUTPUT

    - name: Checkout extras repository
      uses: actions/checkout@v6
      if: ${{ inputs.extra_repo != '' }}
      with:
        repository: ${{ inputs.extra_repo }}
        path: extras
        token: ${{ steps.generate_token.outputs.token }}
        ref: ${{ steps.read_extra_repo_sha.outputs.extra_repo_sha }}

    - name: Install external engines requirements
      if: ${{ inputs.setup_external_engine_requirements == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${{ inputs.extra_repo }}" ]; then
          echo "setup_external_engine_requirements=true but extra_repo was not provided"
          exit 1
        fi

        REQ_FILE="extras/python/engines/requirements.txt"

        if [ ! -f "$REQ_FILE" ]; then
          echo "Requirements file not found: $REQ_FILE"
          exit 1
        fi

        python -m pip install -r "$REQ_FILE"

    - name: Download the host compiler wheel
      uses: actions/download-artifact@v8
      if: ${{ inputs.release_run_id != 'none' }}
      with:
        run-id: ${{ inputs.release_run_id }}
        name: host-compiler-wheel
        path: wheels
        github-token: ${{ steps.generate_token.outputs.token }}

    - name: Download the host runtime wheel
      uses: actions/download-artifact@v8
      if: ${{ inputs.release_run_id != 'none' }}
      with:
        run-id: ${{ inputs.release_run_id }}
        name: host-runtime-wheel
        path: wheels
        github-token: ${{ steps.generate_token.outputs.token }}

    - name: Download the host turbine wheel
      uses: actions/download-artifact@v8
      if: ${{ inputs.release_run_id != 'none' }}
      with:
        run-id: ${{ inputs.release_run_id }}
        name: host-turbine-wheel
        path: wheels
        github-token: ${{ steps.generate_token.outputs.token }}

    - name: Download torq-cm-rt
      uses: actions/download-artifact@v8
      if: ${{ inputs.release_run_id != 'none' }}
      with:
        run-id: ${{ inputs.release_run_id }}
        name: torq-rt-cm
        path: ${{ github.workspace }}

    - name: Restoring permissions for torq-rt-cm
      shell: bash
      run: |
        chmod +x torq_rt_cm

    - name: Setup python virtualenv with release files
      shell: bash
      run: |
        pip install wheels/*

        # we add the python directories from the checkout because they are not fully
        # packaged into wheels (testing infra notably)
        cat > $(python -c "import site; print(site.getsitepackages()[0])")/torq.pth << EOF
        ${{github.workspace}}/python
        ${{github.workspace}}/extras/python
        EOF

    - name: Download precomputed test cache
      if: ${{ inputs.precomputed_cache != '' }}
      shell: bash
      env:
        PRECOMPUTED_CACHE: ${{ inputs.precomputed_cache }}
      run: |        
        set -x

        mkdir -p .pytest_cache/d/
        cd .pytest_cache/d/

        python3 - <<EOF
        import boto3        
        import os

        s3_path = os.environ['PRECOMPUTED_CACHE']
        bucket, key = s3_path.replace("s3://", "").split("/", 1)

        s3 = boto3.client("s3")

        print("Downloading precomputed cache from", s3_path)
        s3.download_file(bucket, key, "cache.tar.gz")
        EOF
        
        tar -zxf cache.tar.gz
        rm cache.tar.gz

    - name: Download astra release
      if: ${{ inputs.use_bench == 'true' }}
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ inputs.release_run_id }}
        name: astra-sl-release

    - name: Extract astra release
      if: ${{ inputs.use_bench == 'true' }}
      shell: bash
      run: |
        mkdir -p release
        tar -C release -xzf astra-release.tar.gz

    - name: Setup bench
      if: ${{ inputs.use_bench == 'true' }}
      shell: bash
      env:
        JENKINS_USER: ${{ inputs.jenkins_user }}
        JENKINS_API_TOKEN: ${{ inputs.jenkins_api_token }}
        JENKINS_URL: ${{ inputs.jenkins_url }}
        JENKINS_JOB: ${{ inputs.jenkins_job }}
      run: |
        python3 -u -m torq.utils.boards setup-for-ci \
            --control-file bench-control.json \
            --local-runner-path ${{github.workspace}}/release/tools/astra-sl-torq-run-module \
            --local-ko-path ${{github.workspace}}/release/lib/syna_npu.ko \
            --build-version 202605200846

    - name: Run pytest
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf_token }}
        TORQ_PERF_SERVER: ${{ inputs.torq_perf_server }}
        TORQ_PERF_SERVER_TOKEN: ${{ inputs.torq_perf_server_token }}
        TORQ_PERF_BATCH_NAME: ${{ inputs.batch_name }}
        S3_HF_CACHE_BUCKET_NAME: ${{ inputs.s3_hf_cache_bucket }}
        S3_HF_CACHE_DIR: ${{ inputs.s3_hf_cache_dir }}
        TORQ_RT_CM: ${{ github.workspace }}/torq_rt_cm
        JENKINS_USER: ${{ inputs.jenkins_user }}
        JENKINS_API_TOKEN: ${{ inputs.jenkins_api_token }}
        JENKINS_URL: ${{ inputs.jenkins_url }}
        JENKINS_JOB: ${{ inputs.jenkins_job }}        
      run: |            

        set -x

        if [[ ${{ inputs.use_bench }} == 'true' ]]; then
          CONTROL_PARAMS="--torq-bench-control-file ${{github.workspace}}/bench-control.json"
        fi

        if pytest $CONTROL_PARAMS --no-phases-dump ${{ inputs.pytest_args }}; then
          echo "pytest passed"
        else
          PYTEST_EXIT_CODE=$?
          if [[ "${{ inputs.ignore_failures }}" == 'true' ]]; then
            echo "pytest failed with exit code $PYTEST_EXIT_CODE, but ignore_failures=true so continuing"
            exit 0
          fi

          exit "$PYTEST_EXIT_CODE"

        fi

    - name: Release bench
      if: ${{ inputs.use_bench == 'true'  && always() }}
      shell: bash
      env:
        JENKINS_USER: ${{ inputs.jenkins_user }}
        JENKINS_API_TOKEN: ${{ inputs.jenkins_api_token }}
        JENKINS_URL: ${{ inputs.jenkins_url }}
        JENKINS_JOB: ${{ inputs.jenkins_job }}
      run: |
        python3 -u -m torq.utils.boards release \
            --control-file bench-control.json

    - name: Create compressed test data cache artifact
      if: ${{ inputs.test_data_cache_artifact != '' || inputs.s3_artifact_bucket != '' }}
      shell: bash
      run: |
        tar -zcf cache.tar.gz -C .pytest_cache/d/ versioned_fixtures

    - name: Upload test data cache to GitHub
      if: ${{ inputs.test_data_cache_artifact != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.test_data_cache_artifact }}
        path: cache.tar.gz
        retention-days: 7 # delete quickly because these are very large

    - name: Upload cache to S3
      if: ${{ inputs.s3_artifact_bucket != '' }}
      id: upload_s3
      shell: bash
      env:        
        S3_BUCKET: ${{ inputs.s3_artifact_bucket }}
        CACHE_FILE: 
      run: |

        set -x

        python3 - <<EOF
        import os
        import uuid
        import boto3

        artifact_name = f"artifact-{uuid.uuid4()}.tar.gz"

        s3_bucket = os.environ['S3_BUCKET']

        s3 = boto3.client("s3")

        # we need to monkey patch boto3 because the ifnonematch header is not yet supported
        # (see https://github.com/boto/boto3/issues/4366)
        import s3transfer
        boto3.s3.transfer.S3Transfer.ALLOWED_UPLOAD_ARGS.append("IfNoneMatch")
        s3transfer.upload.UploadSubmissionTask.CREATE_MULTIPART_BLOCKLIST.append("IfNoneMatch")
        s3transfer.upload.UploadSubmissionTask.PUT_OBJECT_BLOCKLIST.append("IfNoneMatch")
        s3transfer.upload.UploadSubmissionTask.COMPLETE_MULTIPART_ARGS.append("IfNoneMatch")
        
        print(f"Uploading cache to s3://{s3_bucket}/{artifact_name}")

        # force to use multipart to ensure the above monkey patch is used
        config = boto3.s3.transfer.TransferConfig(multipart_threshold=1)

        # Add If-None-Match header to avoid overwriting if the object exists (required by policy)
        s3.upload_file("cache.tar.gz", s3_bucket, artifact_name, ExtraArgs={"IfNoneMatch": "*"}, Config=config)

        # Output the S3 path for GitHub Actions        
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
          out.write(f"s3_cache_path=s3://{s3_bucket}/{artifact_name}\n")
        EOF
