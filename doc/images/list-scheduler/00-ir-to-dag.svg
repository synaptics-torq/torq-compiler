<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1640" height="800" viewBox="0 0 1640 800">
<rect width="1640" height="800" fill="#ffffff"/>
<text x="820" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">Step 0: the input IR becomes a dependency graph (StreamGraph)</text>
<rect x="30" y="70" width="430" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">Input NSS stream (one block, in order)</text>
<rect x="46" y="116" width="398" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="56" y="134" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 0</text>
<text x="84" y="134" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">torq_hl.load  %w1 &lt;- xram</text>
<rect x="46" y="152" width="398" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="56" y="170" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 1</text>
<text x="84" y="170" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">start_program P1(%w1, %x)</text>
<rect x="46" y="188" width="398" height="26" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="56" y="206" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 2</text>
<text x="84" y="206" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">wait_program  P1      // y1 ready</text>
<rect x="46" y="224" width="398" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="56" y="242" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 3</text>
<text x="84" y="242" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">torq_hl.load  %w2 &lt;- xram</text>
<rect x="46" y="260" width="398" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="56" y="278" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 4</text>
<text x="84" y="278" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">start_program P2(%w2, %x)</text>
<rect x="46" y="296" width="398" height="26" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="56" y="314" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 5</text>
<text x="84" y="314" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">wait_program  P2</text>
<rect x="46" y="332" width="398" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="56" y="350" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 6</text>
<text x="84" y="350" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">torq_hl.load  %w3 &lt;- xram</text>
<rect x="46" y="368" width="398" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="56" y="386" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 7</text>
<text x="84" y="386" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">start_program P3(%w3, %y1)</text>
<rect x="46" y="404" width="398" height="26" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="56" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 8</text>
<text x="84" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">wait_program  P3      // y3 ready</text>
<rect x="46" y="440" width="398" height="26" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
<text x="56" y="458" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="start"> 9</text>
<text x="84" y="458" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">torq_hl.store %y3 -&gt; xram</text>
<text x="48" y="502" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Pure ops (allocs, views, invocations) are not</text>
<text x="48" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">nodes to schedule: each is emitted right before</text>
<text x="48" y="538" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">the first action that needs it.</text>
