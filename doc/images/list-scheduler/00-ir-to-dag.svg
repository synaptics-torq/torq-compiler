<polygon points="1010.0,603.0 1015.0,592.0 1005.0,592.0" fill="#9333ea"/>
<line x1="653.0" y1="417.0" x2="947.0" y2="483.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="947.0,483.0 937.4,475.7 935.2,485.5" fill="#dc2626"/>
<line x1="1010.0" y1="657.0" x2="1010.0" y2="723.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="1010.0,723.0 1015.0,712.0 1005.0,712.0" fill="#dc2626"/>
<rect x="515.0" y="123.0" width="150" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="590" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">L1</text>
<text x="590" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">load w1  30 cyc</text>
<rect x="725.0" y="123.0" width="150" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="800" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">L2</text>
<text x="800" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">load w2  30 cyc</text>
<rect x="935.0" y="123.0" width="150" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1010" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">L3</text>
<text x="1010" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">load w3  30 cyc</text>
<rect x="515.0" y="243.0" width="150" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="590" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">start P1</text>
<text x="590" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">100 cyc</text>
<rect x="725.0" y="243.0" width="150" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="800" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">start P2</text>
<text x="800" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">100 cyc</text>
<rect x="515.0" y="363.0" width="150" height="54" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/>
<text x="590" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">wait P1</text>
<text x="590" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">frees w1</text>
<rect x="725.0" y="363.0" width="150" height="54" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/>
<text x="800" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">wait P2</text>
<text x="800" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">frees w2</text>
<rect x="935.0" y="483.0" width="150" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1010" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">start P3</text>
<text x="1010" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">100 cyc</text>
<rect x="935.0" y="603.0" width="150" height="54" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/>
<text x="1010" y="626" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">wait P3</text>
<text x="1010" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">frees w3, y1</text>
<rect x="935.0" y="723.0" width="150" height="54" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="1010" y="746" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">S3</text>
<text x="1010" y="764" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">store y3  20 cyc</text>
<rect x="500" y="112" width="600" height="76" rx="14" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
<text x="1100" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">Sources: no predecessors.</text>
<text x="1100" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#16a34a" text-anchor="start">The scheduler starts here, at the TOP:</text>
<text x="1100" y="104" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#16a34a" text-anchor="start">only these are ready at t = 0.</text>
<text x="1100" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">P3 reads y1, which P1 writes:</text>
<text x="1100" y="486" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">memory edge from wait P1</text>
<text x="1100" y="502" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">(P1 holds its buffers until its wait).</text>
<text x="1100" y="740" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">The store reads y3:</text>
<text x="1100" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">it must follow wait P3.</text>
<text x="1120" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Node kinds</text>
<rect x="1120" y="232" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="1154" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">Load (DMA in)</text>
<rect x="1120" y="254" width="26" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="1154" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">start_program (slice)</text>
<rect x="1120" y="276" width="26" height="16" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="1154" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">wait_program</text>
<rect x="1120" y="298" width="26" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="1154" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">Store (DMA out)</text>
<text x="1120" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Edges (A -&gt; B: A must come first)</text>
<line x1="1120.0" y1="350.0" x2="1150.0" y2="350.0" stroke="#475569" stroke-width="1.8"/>
<polygon points="1150.0,350.0 1139.0,345.0 1139.0,355.0" fill="#475569"/>
<text x="1158" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">uses the loaded buffer (SSA / read-after-write)</text>
<line x1="1120.0" y1="372.0" x2="1150.0" y2="372.0" stroke="#9333ea" stroke-width="1.8"/>
<polygon points="1150.0,372.0 1139.0,367.0 1139.0,377.0" fill="#9333ea"/>
<text x="1158" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">a program&#x27;s start before its wait</text>
<line x1="1120.0" y1="394.0" x2="1150.0" y2="394.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="1150.0,394.0 1139.0,389.0 1139.0,399.0" fill="#dc2626"/>
<text x="1158" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0f172a" text-anchor="start">memory: reads bytes an earlier op writes</text>
</svg>
