{% extends "admin/base_site.html" %}
{% load i18n %}

{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Home</a>
  &rsaquo; <a href="{% url 'admin_database_backup' %}">Backup Database</a>
  &rsaquo; Delete
</div>
{% endblock %}

{% block content %}
<div id="content-main">
  <p class="help">
    Delete the backup created on {{ backup.created_at }}
    (<code>{{ backup.filename }}</code>).
    <strong>This operation is irreversible.</strong>
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="Delete Backup" class="default">
      <a href="{% url 'admin_database_backup' %}" class="closelink">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
